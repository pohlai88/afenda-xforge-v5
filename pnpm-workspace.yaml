packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads these from here only; in .npmrc they are silently ignored.
saveExact: true
engineStrict: true

# Shared versions, pinned exactly. Workspaces reference these with "catalog:".
catalog:
  "@axe-core/playwright": 4.13.0
  "@base-ui/react": 1.8.0
  "@playwright/test": 1.62.1
  "@tailwindcss/postcss": 4.3.3
  "@testing-library/dom": 10.4.1
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@types/node": 24.13.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  "@vitejs/plugin-react": 6.1.1
  "@vitest/coverage-v8": 5.0.0
  jsdom: 30.0.1
  lucide-react: 1.41.0
  next: 16.3.4
  next-themes: 0.4.6
  react: 19.2.8
  react-dom: 19.2.8
  server-only: 0.0.1
  sonner: 2.0.8
  tailwindcss: 4.3.3
  typescript: 5.9.3
  vitest: 5.0.0
  web-vitals: 6.2.1
  zod: 4.5.4

minimumReleaseAgeExclude:
  - cn@0.2.5
  - lucide-react@1.41.0
  - shadcn@4.21.0
  - ultracite@7.10.8
  - '@base-ui/react@1.8.0'
  - '@base-ui/utils@0.4.0'

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
