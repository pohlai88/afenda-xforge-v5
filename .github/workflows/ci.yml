name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 1
      DATA_SOURCE: fixtures
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: pnpm --filter @xforge/web exec playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app on port 3100 when CI is set,
      # and faults the glitch workspace so the error state has a browser test.
      - run: pnpm --filter @xforge/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
